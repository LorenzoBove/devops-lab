services:

  mongodb:
    image: mongo:7
    container_name: devops-lab-mongodb
    restart: unless-stopped

    volumes:
      - mongodb-data:/data/db

    networks:
      - devops-lab


  api:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: devops-lab-api
    restart: unless-stopped

    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: devops_lab

    ports:
      - "8000:8000"

    depends_on:
      - mongodb

    networks:
      - devops-lab


volumes:
  mongodb-data:
    external: true
    name: devops-lab-mongodb-data


networks:
  devops-lab: