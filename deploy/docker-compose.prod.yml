services:

  mongodb:
    image: mongo:7
    container_name: devops-lab-mongodb
    restart: unless-stopped

    volumes:
      - mongodb-data:/data/db

    networks:
      - devops-lab

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  api:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: devops-lab-api
    restart: unless-stopped

    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: devops_lab

    ports:
      - "8000:8000"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - devops-lab

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  mongodb-data:
    external: true
    name: devops-lab-mongodb-data


networks:
  devops-lab: