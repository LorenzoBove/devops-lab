services:

  mongodb:
    image: mongo:7
    container_name: devops-lab-mongodb

    ports:
      - "27017:27017"

    volumes:
      - devops-lab-mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: devops-lab-api:0.1.0

    container_name: devops-lab-api

    ports:
      - "8000:8000"

    env_file:
      - .env


    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s


volumes:
  devops-lab-mongodb-data: